name: Preview release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Build, test and package the tagged source
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: ./scripts/package-release.ps1 -Version $env:RELEASE_TAG.Substring(1)
      - name: Publish preview assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $assets = Get-ChildItem -LiteralPath ./artifacts -File | ForEach-Object FullName
          gh release create $env:RELEASE_TAG @assets --verify-tag --prerelease --title "SelectionExplainer $env:RELEASE_TAG Preview" --notes-file release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publication failed.' }
